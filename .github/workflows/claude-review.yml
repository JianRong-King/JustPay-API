name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Skip when secret is missing
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY not set. Claude review skipped."

      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.ANTHROPIC_API_KEY != ''
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the JustPay multi-currency wallet API.

            1. Read CLAUDE.md and every file in .claude/rules/. They are the source of truth.
            2. Read the diff with `gh pr diff`, then the full changed files.
            3. Apply the checklists in .claude/agents/money-rules-reviewer.md and
               .claude/agents/test-guardian.md.
            4. Only report real problems: money lost, duplicated or wrong; broken rule;
               wrong status or error code; missing, skipped or weakened test;
               edited applied migration; new dependency in pom.xml.
               No style nitpicks.
            5. Post each problem as an inline comment on the exact line, with a concrete
               failing scenario and a one-line fix.
            6. Post one summary comment with `gh pr comment`: CLEAN or the list of findings
               ranked HIGH / MEDIUM / LOW.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 10
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Skip when secret is missing
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY not set. @claude reply skipped."

      - name: Only repo members can trigger
        if: env.ANTHROPIC_API_KEY != '' && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        run: |
          echo "::notice::@claude ignored: commenter is not a repo member."
          exit 1

      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.ANTHROPIC_API_KEY != ''
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 10
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
